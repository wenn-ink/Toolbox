<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>iPhone 友善文字編輯器</title>
<style>
  :root {
    --base-font-size: 16px;
    --bg-color: #FDF6E3; 
    --text-color: #333333; 
    --border-color: #D4CDB3;
    --btn-bg: #EAE3CB;
    --btn-active: #D4CDB3;
    --primary-btn: #D3A27D; 
  }

  html {
    font-size: var(--base-font-size);
    transition: font-size 0.3s ease;
  }

  body {
    background-color: var(--bg-color);
    color: var(--text-color);
    font-family: sans-serif;
    margin: 0;
    padding: 1rem;
    display: flex;
    flex-direction: column;
    height: 100vh;
    box-sizing: border-box;
  }

  .header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 0.5rem;
  }

  h1 {
    font-size: 1.2rem;
    margin: 0;
  }

  button {
    font-size: 1rem;
    padding: 0.6rem;
    border: 1px solid var(--border-color);
    border-radius: 0.3rem;
    background-color: var(--btn-bg);
    color: var(--text-color);
    cursor: pointer;
    touch-action: manipulation;
  }

  button:active {
    background-color: var(--btn-active);
  }

  .editor-container {
    flex-grow: 1;
    display: flex;
    flex-direction: column;
    margin-bottom: 0.5rem;
  }

  textarea {
    flex-grow: 1;
    width: 100%;
    box-sizing: border-box;
    font-size: 1.2rem;
    padding: 0.8rem;
    border: 1px solid var(--border-color);
    border-radius: 0.5rem;
    background-color: #FFFDF8;
    color: var(--text-color);
    resize: none;
    line-height: 1.6;
  }

  textarea:focus {
    outline: 2px solid var(--primary-btn);
  }

  .symbol-bar {
    display: flex;
    gap: 0.5rem;
    margin-bottom: 0.5rem;
    overflow-x: auto;
    padding-bottom: 0.3rem;
  }

  .symbol-bar button {
    flex: 0 0 auto;
    min-width: 3rem;
  }

  .toolbar {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 0.5rem;
    margin-bottom: 0.5rem;
  }

  .numpad-wrapper {
    margin-bottom: 0.5rem;
    padding: 0.5rem;
    background-color: #F4EED8;
    border: 1px solid var(--border-color);
    border-radius: 0.5rem;
  }

  .numpad-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 0.5rem;
  }

  .numpad-grid button {
    padding: 1rem 0;
    font-size: 1.5rem;
    font-weight: bold;
    background-color: #FFFDF8;
  }

  .numpad-grid button:active {
    background-color: var(--btn-active);
  }

  .numpad-grid .numpad-action {
    font-size: 1rem;
    background-color: var(--btn-bg);
  }

  .draft-section {
    display: flex;
    flex-direction: column;
    gap: 0.6rem;
    margin-bottom: 0.5rem;
    border-top: 1px solid var(--border-color);
    padding-top: 0.5rem;
  }

  .draft-item {
    display: flex;
    flex-direction: column;
    border-bottom: 1px dashed var(--border-color);
    padding-bottom: 0.5rem;
  }
  
  .draft-item:last-child {
    border-bottom: none;
  }

  .draft-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 0.5rem;
  }

  .draft-row span {
    font-size: 0.95rem;
    font-weight: bold;
    flex-grow: 1;
  }
  
  .draft-preview {
    font-size: 0.85rem;
    color: #666666;
    margin-top: 0.3rem;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .action-bar {
    display: flex;
    gap: 0.5rem;
    margin-top: auto;
  }

  .action-bar button {
    flex: 1;
    background-color: var(--primary-btn);
    color: #fff;
    font-weight: bold;
    border: none;
    padding: 0.8rem;
  }

  .action-bar button:active {
    background-color: #B88561;
  }
</style>
</head>
<body>

  <div class="header">
    <h1>簡易編輯器</h1>
    <div>
      <button onclick="changeFontSize(-2)">A-</button>
      <button onclick="changeFontSize(2)">A+</button>
    </div>
  </div>

  <div class="symbol-bar">
    <button onclick="insertDate()">時鐘</button>
    <button onclick="toggleNumpad()">9</button>
    <button onclick="insertText('「')">「</button>
    <button onclick="insertText('」')">」</button>
    <button onclick="insertText('〈')">〈</button>
    <button onclick="insertText('〉')">〉</button>
    <button onclick="insertText('《')">《</button>
    <button onclick="insertText('》')">》</button>
    <button onclick="insertText('、')">、</button>
    <button onclick="insertText('。')">。</button>
  </div>

  <div class="editor-container">
    <textarea id="editor" placeholder="在此輸入內容..."></textarea>
  </div>

  <div class="toolbar">
    <button onclick="moveCursor('up')">上</button>
    <button onclick="moveCursor('down')">下</button>
    <button onclick="moveCursor('left')">左</button>
    <button onclick="moveCursor('right')">右</button>
    <button onclick="deleteChar()">刪除</button>
  </div>

  <div id="numpad" class="numpad-wrapper" style="display: none;">
    <div class="numpad-grid">
      <button onclick="insertText('1')">1</button>
      <button onclick="insertText('2')">2</button>
      <button onclick="insertText('3')">3</button>
      <button onclick="insertText('4')">4</button>
      <button onclick="insertText('5')">5</button>
      <button onclick="insertText('6')">6</button>
      <button onclick="insertText('7')">7</button>
      <button onclick="insertText('8')">8</button>
      <button onclick="insertText('9')">9</button>
      <button class="numpad-action" onclick="toggleNumpad()">收起</button>
      <button onclick="insertText('0')">0</button>
      <button class="numpad-action" onclick="deleteChar()">刪除</button>
    </div>
  </div>

  <div class="draft-section">
    <div class="draft-item">
      <div class="draft-row">
        <span>草稿位 1</span>
        <div>
          <button onclick="saveDraft(1)">存入</button>
          <button onclick="loadDraft(1)">讀取</button>
        </div>
      </div>
      <div class="draft-preview" id="preview-1">尚無存檔紀錄</div>
    </div>
    
    <div class="draft-item">
      <div class="draft-row">
        <span>草稿位 2</span>
        <div>
          <button onclick="saveDraft(2)">存入</button>
          <button onclick="loadDraft(2)">讀取</button>
        </div>
      </div>
      <div class="draft-preview" id="preview-2">尚無存檔紀錄</div>
    </div>

    <div class="draft-item">
      <div class="draft-row">
        <span>草稿位 3</span>
        <div>
          <button onclick="saveDraft(3)">存入</button>
          <button onclick="loadDraft(3)">讀取</button>
        </div>
      </div>
      <div class="draft-preview" id="preview-3">尚無存檔紀錄</div>
    </div>
  </div>

  <div class="action-bar">
    <button onclick="copyAll()">一鍵複製全文</button>
  </div>

  <script>
    const editor = document.getElementById('editor');
    let currentFontSize = 16;
    const PREVIEW_CHAR_LIMIT = 10; 

    window.onload = function() {
        updatePreview(1);
        updatePreview(2);
        updatePreview(3);
    };

    function getFormattedDate() {
      const d = new Date();
      const year = d.getFullYear();
      const month = String(d.getMonth() + 1).padStart(2, '0');
      const day = String(d.getDate()).padStart(2, '0');
      const hours = String(d.getHours()).padStart(2, '0');
      const minutes = String(d.getMinutes()).padStart(2, '0');
      return `[${year}/${month}/${day} ${hours}:${minutes}]`;
    }

    function insertDate() {
      const d = new Date();
      const year = d.getFullYear();
      const month = String(d.getMonth() + 1).padStart(2, '0');
      const day = String(d.getDate()).padStart(2, '0');
      insertText(`${year}/${month}/${day}`);
    }

    function updatePreview(slot) {
      const rawData = localStorage.getItem('editor_draft_' + slot);
      const previewElement = document.getElementById('preview-' + slot);

      if (!rawData) {
        previewElement.textContent = '尚無存檔紀錄';
        return;
      }

      let draftData;
      try {
        draftData = JSON.parse(rawData);
      } catch (e) {
        draftData = { time: '[無時間紀錄]', text: rawData };
      }

      let cleanText = draftData.text.replace(/\n/g, ' ').trim();
      let previewText = cleanText.substring(0, PREVIEW_CHAR_LIMIT);
      
      if (cleanText.length > PREVIEW_CHAR_LIMIT) {
        previewText += '...';
      }

      previewElement.textContent = `${draftData.time} ${previewText}`;
    }

    function changeFontSize(change) {
      currentFontSize += change;
      if (currentFontSize < 12) currentFontSize = 12;
      if (currentFontSize > 32) currentFontSize = 32;
      document.documentElement.style.setProperty('--base-font-size', currentFontSize + 'px');
    }

    function insertText(text) {
      const start = editor.selectionStart;
      const end = editor.selectionEnd;
      const currentText = editor.value;
      
      editor.value = currentText.substring(0, start) + text + currentText.substring(end);
      editor.focus();
      editor.setSelectionRange(start + text.length, start + text.length);
    }

    function deleteChar() {
      editor.focus();
      const start = editor.selectionStart;
      const end = editor.selectionEnd;
      const currentText = editor.value;

      if (start === end) {
        if (start > 0) {
          editor.value = currentText.substring(0, start - 1) + currentText.substring(end);
          editor.setSelectionRange(start - 1, start - 1);
        }
      } else {
        editor.value = currentText.substring(0, start) + currentText.substring(end);
        editor.setSelectionRange(start, start);
      }
    }

    function toggleNumpad() {
      const numpad = document.getElementById('numpad');
      if (numpad.style.display === 'none') {
        numpad.style.display = 'block';
        editor.focus(); 
      } else {
        numpad.style.display = 'none';
        editor.focus();
      }
    }

    function moveCursor(direction) {
      editor.focus();
      let start = editor.selectionStart;
      let text = editor.value;

      if (direction === 'left' && start > 0) {
        editor.setSelectionRange(start - 1, start - 1);
      } else if (direction === 'right' && start < text.length) {
        editor.setSelectionRange(start + 1, start + 1);
      } else if (direction === 'up') {
        let prevLineEnd = text.lastIndexOf('\n', start - 1);
        let prevLineStart = text.lastIndexOf('\n', prevLineEnd - 1);
        if (prevLineEnd !== -1) {
            let currentLineOffset = start - prevLineEnd - 1;
            let newPos = prevLineStart + 1 + currentLineOffset;
            if (newPos > prevLineEnd) newPos = prevLineEnd;
            editor.setSelectionRange(newPos, newPos);
        } else {
            editor.setSelectionRange(0, 0);
        }
      } else if (direction === 'down') {
         let nextLineStart = text.indexOf('\n', start);
         if (nextLineStart !== -1) {
             let currentLineStart = text.lastIndexOf('\n', start - 1);
             let currentLineOffset = start - currentLineStart - 1;
             let nextLineEnd = text.indexOf('\n', nextLineStart + 1);
             if (nextLineEnd === -1) nextLineEnd = text.length;
             let newPos = nextLineStart + 1 + currentLineOffset;
             if (newPos > nextLineEnd) newPos = nextLineEnd;
             editor.setSelectionRange(newPos, newPos);
         } else {
             editor.setSelectionRange(text.length, text.length);
         }
      }
    }

    function saveDraft(slot) {
      const content = editor.value;
      const timestamp = getFormattedDate();
      
      const draftData = {
        time: timestamp,
        text: content
      };
      
      localStorage.setItem('editor_draft_' + slot, JSON.stringify(draftData));
      updatePreview(slot); 
      alert('已存入草稿位 ' + slot);
    }

    function loadDraft(slot) {
      const rawData = localStorage.getItem('editor_draft_' + slot);
      if (!rawData) {
        alert('草稿位 ' + slot + ' 目前為空。');
        return;
      }
      
      if (editor.value.trim() !== '') {
        const confirmLoad = confirm('編輯區內已有文字，讀取草稿將會覆蓋當前內容。是否繼續？');
        if (!confirmLoad) return;
      }
      
      try {
        const draftData = JSON.parse(rawData);
        editor.value = draftData.text; 
      } catch (e) {
        editor.value = rawData;
      }
    }

    function copyAll() {
      editor.select();
      editor.setSelectionRange(0, 99999); 
      
      navigator.clipboard.writeText(editor.value).then(() => {
        alert('全文已複製！');
        const length = editor.value.length;
        editor.setSelectionRange(length, length);
      }).catch(err => {
        alert('複製失敗，請手動全選複製。');
      });
    }
  </script>
</body>
</html>
