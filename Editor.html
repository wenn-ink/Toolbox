<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>手機打字不苦</title>
<style>
  /* ══ 亮色主題（預設） ══ */
  :root {
    --base-font-size: 16px;
    --bg: #FDF6E3;
    --text: #333333;
    --border: #D0C9B0;
    --area-bg: #F7F0DC;
    --editor-bg: #FFFDF8;
    --bubble-bg: #FFFDF8;
    --shadow: rgba(80,50,10,0.13);

    --btn-default-bg: #EDEADE;
    --btn-default-text: #444444;
    --btn-move-bg: #E8EAE0;
    --btn-move-text: #3D4A3D;
    --btn-history-bg: #E5EDE5;
    --btn-history-text: #2E4A2E;
    --btn-delete-bg: #C8784A;
    --btn-delete-text: #FFFFFF;
    --btn-symbol-bg: #EDEADE;
    --btn-symbol-text: #4A4030;
    --btn-draft-bg: #EDEADE;
    --btn-draft-del-bg: #F0E4E4;
    --btn-draft-del-text: #7A3030;

    --btn-paste-bg: #7A9E7E;
    --btn-paste-text: #FFFFFF;
    --btn-clear-bg: #A0845A;
    --btn-clear-text: #FFFFFF;
    --btn-copy-bg: #C8925A;
    --btn-copy-text: #FFFFFF;

    --btn-kbd-bg: #DEDAD0;
    --btn-kbd-text: #333333;
    --btn-kbd-on-bg: #B8D4B8;
    --btn-kbd-on-text: #1A3A1A;

    --ctrl-label: #9A8A6A;
    --draft-title: #5A4A2A;
    --draft-preview: #888888;
    --autosave-title: #3A5A3A;
    --focus-outline: #C8925A;
    --warn-color: #8B3030;
    --divider: #D0C9B0;
  }

  /* ══ 深色主題 ══ */
  body.dark {
    --bg: #1E1A14;
    --text: #D9CEB0;
    --border: #4A4232;
    --area-bg: #2A2418;
    --editor-bg: #252018;
    --bubble-bg: #2A2418;
    --shadow: rgba(0,0,0,0.4);

    --btn-default-bg: #302A20;
    --btn-default-text: #C8BC98;
    --btn-move-bg: #283028;
    --btn-move-text: #A8C4A8;
    --btn-history-bg: #243024;
    --btn-history-text: #90B890;
    --btn-delete-bg: #8C4820;
    --btn-delete-text: #FFE8D8;
    --btn-symbol-bg: #302A20;
    --btn-symbol-text: #C0B080;
    --btn-draft-bg: #302A20;
    --btn-draft-del-bg: #3A2020;
    --btn-draft-del-text: #C88080;

    --btn-paste-bg: #2E4E32;
    --btn-paste-text: #B8D8BC;
    --btn-clear-bg: #4A3820;
    --btn-clear-text: #D8C8A0;
    --btn-copy-bg: #7A4E28;
    --btn-copy-text: #FFE8D0;

    --btn-kbd-bg: #2A2418;
    --btn-kbd-text: #D8C898;       /* 深色模式：淺米色 */
    --btn-kbd-on-bg: #2A4030;
    --btn-kbd-on-text: #A8D8B8;

    --ctrl-label: #7A6E54;
    --draft-title: #C0A870;
    --draft-preview: #706858;
    --autosave-title: #70A870;
    --focus-outline: #A0703A;
    --warn-color: #D08080;
    --divider: #4A4232;
  }

  * { -webkit-appearance: none; box-sizing: border-box; }
  button { -webkit-appearance: none; color: var(--btn-default-text); }
  html { font-size: var(--base-font-size); transition: font-size 0.25s ease; }

  body {
    background-color: var(--bg);
    color: var(--text);
    font-family: "PingFang TC", "Noto Sans TC", sans-serif;
    margin: 0; padding: 0;
    display: flex;
    flex-direction: column;
    height: 100dvh;
    overflow: hidden;
    transition: background-color 0.2s, color 0.2s;
  }

  /* ══ 頂部固定區 ══ */
  .sticky-header {
    flex-shrink: 0;
    background-color: var(--bg);
    border-bottom: 1px solid var(--border);
    padding: 0.4rem 0.75rem;
    display: flex;
    flex-direction: column;
    gap: 0.3rem;
    z-index: 10;
    transition: background-color 0.2s;
  }

  /* 第一行：說明 | 樣式 | 框- 框+ | A- A+ */
  .settings-row {
    display: flex;
    gap: 0.3rem;
    align-items: center;
    position: relative;
  }
  .settings-row button {
    flex: 1;
    font-size: 0.85rem;
    padding: 0.42rem 0.2rem;
  }
  .settings-divider {
    width: 1px;
    height: 1.4rem;
    background-color: var(--divider);
    flex-shrink: 0;
  }

  /* 第二行：切換系統鍵盤 */
  #kbdToggleBtn {
    width: 100%;
    font-size: 0.95rem;
    padding: 0.5rem;
    background-color: var(--btn-kbd-bg);
    color: var(--btn-kbd-text);
    font-weight: bold;
    border: 1px solid var(--border);
    border-radius: 0.35rem;
  }
  #kbdToggleBtn.kbd-on {
    background-color: var(--btn-kbd-on-bg);
    color: var(--btn-kbd-on-text);
  }

  /* 第三行：貼上 / 清除 / 複製全文 */
  .action-row {
    display: flex;
    gap: 0.4rem;
  }
  .action-row button {
    font-weight: bold;
    font-size: 0.95rem;
    padding: 0.6rem 0.3rem;
    border: none;
    border-radius: 0.4rem;
    color: #fff;
  }
  .btn-paste  { flex: 1; background-color: var(--btn-paste-bg) !important; color: var(--btn-paste-text) !important; }
  .btn-clear  { flex: 1; background-color: var(--btn-clear-bg) !important; color: var(--btn-clear-text) !important; }
  .btn-copy-top { flex: 2; background-color: var(--btn-copy-bg) !important; color: var(--btn-copy-text) !important; }

  /* ══ 氣泡視窗 ══ */
  .bubble-window {
    display: none;
    position: absolute;
    top: calc(100% + 0.4rem);
    left: 0;
    width: 230px;
    background-color: var(--bubble-bg);
    border: 1px solid var(--border);
    border-radius: 0.5rem;
    padding: 0.8rem 0.9rem;
    box-shadow: 0 4px 14px var(--shadow);
    z-index: 200;
    font-size: 0.86rem;
    color: var(--text);
    transition: background-color 0.2s;
  }
  #info-bubble { left: auto; right: 0; width: 260px; }
  .bubble-window ul { margin: 0; padding-left: 1.1rem; }
  .bubble-window li { margin-bottom: 0.4rem; line-height: 1.5; }
  .bubble-window li:last-child { margin-bottom: 0; }
  .bubble-window .warn { color: var(--warn-color); font-weight: bold; }

  /* 樣式選單 */
  .theme-list { display: flex; flex-direction: column; gap: 0.4rem; }
  .theme-btn {
    width: 100%;
    text-align: left;
    padding: 0.5rem 0.7rem !important;
    font-size: 0.9rem !important;
    border-radius: 0.3rem;
    background-color: var(--btn-default-bg) !important;
    color: var(--btn-default-text) !important;
    border: 1px solid var(--border) !important;
  }
  .theme-btn.active {
    background-color: var(--btn-history-bg) !important;
    color: var(--btn-history-text) !important;
    font-weight: bold;
  }

  /* ══ 滾動區 ══ */
  .scroll-area {
    flex: 1;
    overflow-y: auto;
    overflow-x: hidden;
    padding: 0.6rem 0.75rem;
    display: flex;
    flex-direction: column;
    gap: 0.45rem;
    -webkit-overflow-scrolling: touch;
  }

  /* ══ 通用按鈕 ══ */
  button {
    font-size: 1rem;
    padding: 0.55rem 0.5rem;
    border: 1px solid var(--border);
    border-radius: 0.35rem;
    background-color: var(--btn-default-bg);
    color: var(--btn-default-text);
    cursor: pointer;
    touch-action: manipulation;
    user-select: none;
    -webkit-user-select: none;
    line-height: 1.2;
    text-align: center;
    transition: filter 0.1s, background-color 0.2s, color 0.2s;
  }
  button:active { filter: brightness(0.88); }
  button:disabled { opacity: 0.3; }

  /* ══ 編輯區 ══ */
  .editor-container { display: flex; flex-direction: column; }
  textarea {
    width: 100%;
    min-height: 13rem;
    font-size: 1.2rem;
    padding: 0.8rem;
    border: 1px solid var(--border);
    border-radius: 0.5rem;
    background-color: var(--editor-bg);
    color: var(--text);
    resize: none;
    line-height: 1.6;
    -webkit-appearance: none;
    transition: background-color 0.2s, color 0.2s, border-color 0.2s;
  }
  textarea:focus { outline: 2px solid var(--focus-outline); }

  .ctrl-label {
    font-size: 0.75rem;
    color: var(--ctrl-label);
    margin-bottom: 0.2rem;
    padding-left: 0.1rem;
  }

  /* ══ 方向鍵 ══ */
  .toolbar-move {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 0.4rem;
  }
  .toolbar-move button {
    background-color: var(--btn-move-bg);
    color: var(--btn-move-text);
    font-weight: bold;
    font-size: 1.05rem;
  }

  /* ══ 復原／重做／刪除 ══ */
  .toolbar-action {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 0.4rem;
  }
  .btn-undo, .btn-redo {
    background-color: var(--btn-history-bg);
    color: var(--btn-history-text);
  }
  .btn-del {
    background-color: var(--btn-delete-bg) !important;
    color: var(--btn-delete-text) !important;
    border-color: #A05A30 !important;
    font-weight: bold;
  }

  /* ══ 插入工具列 ══ */
  .toolbar-insert {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 0.4rem;
  }
  .toolbar-insert button {
    background-color: var(--btn-symbol-bg);
    color: var(--btn-symbol-text);
  }

  /* ══ 符號面板 ══ */
  .symbol-panel {
    display: none;
    background-color: var(--area-bg);
    border: 1px solid var(--border);
    border-radius: 0.4rem;
    padding: 0.45rem;
  }
  .symbol-panel .sym-row { display: flex; flex-wrap: wrap; gap: 0.4rem; }
  .symbol-panel button {
    flex: 0 0 auto;
    min-width: 3rem;
    background-color: var(--editor-bg);
    color: var(--btn-symbol-text);
    font-size: 1.05rem;
  }

  /* ══ 數字鍵盤 ══ */
  .numpad-wrapper {
    background-color: var(--area-bg);
    border: 1px solid var(--border);
    border-radius: 0.5rem;
    padding: 0.5rem;
  }
  .numpad-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 0.45rem; }
  .numpad-grid button { padding: 0.9rem 0; font-size: 1.45rem; font-weight: bold; background-color: var(--editor-bg); }
  .numpad-grid .num-action { font-size: 0.9rem; background-color: var(--btn-default-bg); }

  /* ══ 草稿區 ══ */
  .draft-section {
    border-top: 1px solid var(--border);
    padding-top: 0.5rem;
    display: flex;
    flex-direction: column;
  }
  .draft-item {
    display: flex;
    flex-direction: column;
    gap: 0.15rem;
    padding: 0.35rem 0;
    border-bottom: 1px dashed var(--border);
  }
  .draft-item:last-child { border-bottom: none; }
  .draft-row { display: flex; align-items: center; gap: 0.4rem; }
  .draft-row-title {
    font-size: 0.82rem;
    font-weight: bold;
    color: var(--draft-title);
    flex-shrink: 0;
    min-width: 4.5rem;
  }
  .draft-row-title.autosave { color: var(--autosave-title); }
  .draft-btn-group { display: flex; gap: 0.3rem; flex-shrink: 0; margin-left: auto; }
  .draft-btn-group button { font-size: 0.82rem; padding: 0.35rem 0.6rem; background-color: var(--btn-draft-bg); }
  .btn-draft-del {
    background-color: var(--btn-draft-del-bg) !important;
    color: var(--btn-draft-del-text) !important;
    border-color: #D9BABA !important;
  }
  .draft-preview {
    font-size: 0.78rem;
    color: var(--draft-preview);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    line-height: 1.4;
    padding-left: 0.1rem;
  }
</style>
</head>
<body>

<header class="sticky-header" role="banner">

  <!-- 第一行：說明 | 樣式 | 框- 框+ | A- A+ -->
  <div class="settings-row" id="settings-row">

    <button onclick="toggleInfoBubble()" aria-label="說明">說明</button>
    <div id="info-bubble" class="bubble-window" role="tooltip">
      <ul>
        <li>草稿儲存於本機裝置瀏覽器暫存，無雲端同步備份功能。</li>
        <li>可離線使用。</li>
        <li class="warn">不建議輸入機敏資料（如密碼、身份證號等）。</li>
      </ul>
    </div>

    <div class="settings-divider"></div>

    <button onclick="toggleThemeBubble()" aria-label="切換樣式">樣式</button>
    <div id="theme-bubble" class="bubble-window" style="left:2.5rem; right:auto; width:180px;">
      <div class="theme-list">
        <button class="theme-btn active" id="theme-light" onclick="setTheme('light')">亮色（預設）</button>
        <button class="theme-btn" id="theme-dark" onclick="setTheme('dark')">深色</button>
      </div>
    </div>

    <div class="settings-divider"></div>

    <button onclick="changeEditorSize(-3)" aria-label="縮短輸入框">框-</button>
    <button onclick="changeEditorSize(3)" aria-label="加長輸入框">框+</button>

    <div class="settings-divider"></div>

    <button onclick="changeFontSize(-2)" aria-label="縮小字體">A-</button>
    <button onclick="changeFontSize(2)" aria-label="放大字體">A+</button>

  </div>

  <!-- 第二行：切換系統鍵盤 -->
  <button id="kbdToggleBtn" onclick="toggleKeyboard()" aria-label="切換系統鍵盤">
    切換系統鍵盤（目前：關閉）
  </button>

  <!-- 第三行：貼上 / 清除 / 複製全文 -->
  <div class="action-row">
    <button class="btn-paste" onclick="pasteText()" aria-label="貼上">貼上</button>
    <button class="btn-clear" onclick="clearEditor()" aria-label="清除">清除</button>
    <button class="btn-copy-top" onclick="copyAll()" aria-label="複製全文">複製全文</button>
  </div>

</header>

<main class="scroll-area" role="main">

  <div class="editor-container">
    <textarea
      id="editor"
      placeholder="在此輸入內容..."
      inputmode="none"
      aria-label="主編輯區"
      oninput="onEditorInput()"
    ></textarea>
  </div>

  <!-- 方向鍵 -->
  <div>
    <div class="ctrl-label">方向</div>
    <div class="toolbar-move" role="group" aria-label="游標移動">
      <button aria-label="向上"
        onpointerdown="startMove('up')" onpointerup="stopMove()" onpointerleave="stopMove()" onpointercancel="stopMove()">上</button>
      <button aria-label="向下"
        onpointerdown="startMove('down')" onpointerup="stopMove()" onpointerleave="stopMove()" onpointercancel="stopMove()">下</button>
      <button aria-label="向左"
        onpointerdown="startMove('left')" onpointerup="stopMove()" onpointerleave="stopMove()" onpointercancel="stopMove()">左</button>
      <button aria-label="向右"
        onpointerdown="startMove('right')" onpointerup="stopMove()" onpointerleave="stopMove()" onpointercancel="stopMove()">右</button>
    </div>
  </div>

  <!-- 復原／重做／刪除 -->
  <div class="toolbar-action" role="group" aria-label="編輯操作">
    <button class="btn-undo" id="undoBtn" onclick="undo()" disabled aria-label="復原">復原</button>
    <button class="btn-redo" id="redoBtn" onclick="redo()" disabled aria-label="取消復原">取消復原</button>
    <button class="btn-del" id="deleteBtn" aria-label="刪除字元"
      onpointerdown="startDelete()" onpointerup="stopDelete()"
      onpointerleave="stopDelete()" onpointercancel="stopDelete()">刪除</button>
  </div>

  <!-- 插入工具 -->
  <div class="toolbar-insert" role="group" aria-label="插入工具">
    <button onclick="insertDate()" aria-label="插入今日日期">插入日期</button>
    <button onclick="toggleNumpad()" aria-label="數字鍵盤">數字鍵盤</button>
    <button id="symbolToggleBtn" onclick="toggleSymbol()" aria-label="插入符號">插入符號</button>
  </div>

  <!-- 符號面板（移除、。，新增〈〉） -->
  <div id="symbol-panel" class="symbol-panel" aria-label="符號選單">
    <div class="sym-row">
      <button onclick="insertText('「')">「</button>
      <button onclick="insertText('」')">」</button>
      <button onclick="insertText('《')">《</button>
      <button onclick="insertText('》')">》</button>
      <button onclick="insertText('〈')">〈</button>
      <button onclick="insertText('〉')">〉</button>
      <button onclick="insertText('→')">→</button>
      <button onclick="toggleSymbol()" style="font-size:0.85rem">收起</button>
    </div>
  </div>

  <!-- 數字鍵盤 -->
  <div id="numpad" class="numpad-wrapper" style="display:none" aria-label="數字鍵盤">
    <div class="numpad-grid">
      <button onclick="insertText('1')">1</button>
      <button onclick="insertText('2')">2</button>
      <button onclick="insertText('3')">3</button>
      <button onclick="insertText('4')">4</button>
      <button onclick="insertText('5')">5</button>
      <button onclick="insertText('6')">6</button>
      <button onclick="insertText('7')">7</button>
      <button onclick="insertText('8')">8</button>
      <button onclick="insertText('9')">9</button>
      <button class="num-action" onclick="toggleNumpad()">收起</button>
      <button onclick="insertText('0')">0</button>
      <button class="num-action" onclick="deleteChar()">刪除</button>
    </div>
  </div>

  <!-- 草稿管理 -->
  <div class="draft-section" role="group" aria-label="草稿管理">
    <div class="ctrl-label">草稿管理</div>

    <!-- 自動儲存欄位 -->
    <div class="draft-item">
      <div class="draft-row">
        <span class="draft-row-title autosave">自動儲存</span>
        <div class="draft-btn-group">
          <button onclick="loadAutoSave()" aria-label="讀取自動儲存">讀取</button>
          <button class="btn-draft-del" onclick="clearAutoSave()" aria-label="刪除自動儲存">刪除</button>
        </div>
      </div>
      <div id="preview-auto" class="draft-preview" aria-live="polite">尚無自動存檔</div>
    </div>

    <div class="draft-item">
      <div class="draft-row">
        <span class="draft-row-title">草稿 1</span>
        <div class="draft-btn-group">
          <button onclick="saveDraft(1)" aria-label="存入草稿 1">存入</button>
          <button onclick="loadDraft(1)" aria-label="讀取草稿 1">讀取</button>
          <button class="btn-draft-del" onclick="clearDraft(1)" aria-label="刪除草稿 1">刪除</button>
        </div>
      </div>
      <div id="preview-1" class="draft-preview" aria-live="polite">尚無存檔</div>
    </div>

    <div class="draft-item">
      <div class="draft-row">
        <span class="draft-row-title">草稿 2</span>
        <div class="draft-btn-group">
          <button onclick="saveDraft(2)" aria-label="存入草稿 2">存入</button>
          <button onclick="loadDraft(2)" aria-label="讀取草稿 2">讀取</button>
          <button class="btn-draft-del" onclick="clearDraft(2)" aria-label="刪除草稿 2">刪除</button>
        </div>
      </div>
      <div id="preview-2" class="draft-preview" aria-live="polite">尚無存檔</div>
    </div>

    <div class="draft-item">
      <div class="draft-row">
        <span class="draft-row-title">草稿 3</span>
        <div class="draft-btn-group">
          <button onclick="saveDraft(3)" aria-label="存入草稿 3">存入</button>
          <button onclick="loadDraft(3)" aria-label="讀取草稿 3">讀取</button>
          <button class="btn-draft-del" onclick="clearDraft(3)" aria-label="刪除草稿 3">刪除</button>
        </div>
      </div>
      <div id="preview-3" class="draft-preview" aria-live="polite">尚無存檔</div>
    </div>
  </div>

</main>

<script>
  const editor = document.getElementById('editor');
  let currentFontSize = 16;
  let currentEditorRem = 13;
  const EDITOR_MIN = 6, EDITOR_MAX = 40;
  let historyStack = [''];
  let redoStack = [];
  let kbdEnabled = false;
  let currentTheme = 'light';
  const MAX_HISTORY = 30;
  const PREVIEW_LEN = 16;
  const AUTO_SAVE_KEY = 'draft_auto';
  const AUTO_SAVE_INTERVAL = 5 * 60 * 1000; // 5 分鐘

  window.onload = () => {
    updatePreview(1); updatePreview(2); updatePreview(3);
    updateAutoSavePreview();
    updateHistoryButtons();
    const savedTheme = localStorage.getItem('editor_theme');
    if (savedTheme) setTheme(savedTheme, true);
    // 啟動自動儲存
    setInterval(autoSave, AUTO_SAVE_INTERVAL);
  };

  /* ══ 氣泡管理 ══ */
  const allBubbles = ['info-bubble', 'theme-bubble'];
  function closeAllBubbles() {
    allBubbles.forEach(id => document.getElementById(id).style.display = 'none');
  }
  function toggleInfoBubble() {
    const b = document.getElementById('info-bubble');
    const isOpen = b.style.display === 'block';
    closeAllBubbles();
    if (!isOpen) b.style.display = 'block';
  }
  function toggleThemeBubble() {
    const b = document.getElementById('theme-bubble');
    const isOpen = b.style.display === 'block';
    closeAllBubbles();
    if (!isOpen) b.style.display = 'block';
  }
  document.addEventListener('click', e => {
    if (!e.target.closest('.settings-row')) closeAllBubbles();
  });

  /* ══ 主題切換 ══ */
  function setTheme(theme, silent) {
    currentTheme = theme;
    document.body.classList.toggle('dark', theme === 'dark');
    document.getElementById('theme-light').classList.toggle('active', theme === 'light');
    document.getElementById('theme-dark').classList.toggle('active', theme === 'dark');
    if (!silent) { localStorage.setItem('editor_theme', theme); closeAllBubbles(); }
  }

  /* ══ 字體縮放 ══ */
  function changeFontSize(d) {
    currentFontSize = Math.min(Math.max(currentFontSize + d, 12), 32);
    document.documentElement.style.setProperty('--base-font-size', currentFontSize + 'px');
  }

  /* ══ 輸入框高度 ══ */
  function changeEditorSize(d) {
    currentEditorRem = Math.min(Math.max(currentEditorRem + d, EDITOR_MIN), EDITOR_MAX);
    editor.style.minHeight = currentEditorRem + 'rem';
  }

  /* ══ 切換系統鍵盤（修正：focus 延遲） ══ */
  function toggleKeyboard() {
    kbdEnabled = !kbdEnabled;
    const btn = document.getElementById('kbdToggleBtn');
    if (kbdEnabled) {
      editor.removeAttribute('inputmode');
      btn.textContent = '切換系統鍵盤（目前：開啟）';
      btn.classList.add('kbd-on');
    } else {
      editor.setAttribute('inputmode', 'none');
      btn.textContent = '切換系統鍵盤（目前：關閉）';
      btn.classList.remove('kbd-on');
    }
    setTimeout(() => editor.focus(), 50); // 修正：延遲 focus 避免事件衝突
  }

  /* ══ 清除編輯區 ══ */
  function clearEditor() {
    if (editor.value.trim() === '') return;
    if (!confirm('確定要清除輸入區的全部內容嗎？')) return;
    editor.value = '';
    saveHistory();
    setTimeout(() => editor.focus(), 50);
  }

  /* ══ 歷史紀錄（上限 10 次） ══ */
  function onEditorInput() {
    const cur = editor.value;
    if (cur === historyStack[historyStack.length - 1]) return;
    historyStack.push(cur);
    if (historyStack.length > MAX_HISTORY + 1) historyStack.shift();
    redoStack = [];
    updateHistoryButtons();
  }
  function saveHistory() { onEditorInput(); }

  function undo() {
    if (historyStack.length > 1) {
      redoStack.push(historyStack.pop());
      editor.value = historyStack[historyStack.length - 1];
      updateHistoryButtons();
    }
  }
  function redo() {
    if (redoStack.length > 0) {
      const val = redoStack.pop();
      historyStack.push(val);
      editor.value = val;
      updateHistoryButtons();
    }
  }
  function updateHistoryButtons() {
    document.getElementById('undoBtn').disabled = (historyStack.length <= 1);
    document.getElementById('redoBtn').disabled = (redoStack.length === 0);
  }

  /* ══ 刪除字元 ══ */
  function deleteChar() {
    editor.focus();
    const s = editor.selectionStart, e2 = editor.selectionEnd;
    if (s === e2 && s > 0) {
      editor.value = editor.value.substring(0, s - 1) + editor.value.substring(e2);
      editor.setSelectionRange(s - 1, s - 1);
    } else if (s !== e2) {
      editor.value = editor.value.substring(0, s) + editor.value.substring(e2);
      editor.setSelectionRange(s, s);
    }
    saveHistory();
  }

  /* ══ 長按連續刪除 ══ */
  let deleteHoldTimer = null, deleteRepeatTimer = null;
  function startDelete() {
    deleteChar();
    deleteHoldTimer = setTimeout(() => {
      deleteRepeatTimer = setInterval(deleteChar, 80);
    }, 300);
  }
  function stopDelete() {
    clearTimeout(deleteHoldTimer); clearInterval(deleteRepeatTimer);
    deleteHoldTimer = null; deleteRepeatTimer = null;
  }

  /* ══ 插入文字 ══ */
  function insertText(text) {
    const s = editor.selectionStart, e2 = editor.selectionEnd;
    editor.value = editor.value.substring(0, s) + text + editor.value.substring(e2);
    editor.focus();
    editor.setSelectionRange(s + text.length, s + text.length);
    saveHistory();
  }

  /* ══ 游標移動 ══ */
  function moveCursor(direction) {
    editor.focus();
    const start = editor.selectionStart, text = editor.value;
    if (direction === 'left' && start > 0) {
      editor.setSelectionRange(start - 1, start - 1);
    } else if (direction === 'right' && start < text.length) {
      editor.setSelectionRange(start + 1, start + 1);
    } else if (direction === 'up' || direction === 'down') {
      const lines = text.split('\n');
      let acc = 0, lineIdx = 0, colIdx = 0;
      for (let i = 0; i < lines.length; i++) {
        if (start <= acc + lines[i].length) { lineIdx = i; colIdx = start - acc; break; }
        acc += lines[i].length + 1;
      }
      if (direction === 'up' && lineIdx > 0) {
        let newAcc = 0;
        for (let j = 0; j < lineIdx - 1; j++) newAcc += lines[j].length + 1;
        const np = newAcc + Math.min(colIdx, lines[lineIdx-1].length);
        editor.setSelectionRange(np, np);
      } else if (direction === 'down' && lineIdx < lines.length - 1) {
        let newAcc = 0;
        for (let j = 0; j <= lineIdx; j++) newAcc += lines[j].length + 1;
        const np = newAcc + Math.min(colIdx, lines[lineIdx+1].length);
        editor.setSelectionRange(np, np);
      }
    }
  }

  /* ══ 長按連續移動 ══ */
  let moveHoldTimer = null, moveRepeatTimer = null;
  function startMove(dir) {
    moveCursor(dir);
    moveHoldTimer = setTimeout(() => {
      moveRepeatTimer = setInterval(() => moveCursor(dir), 80);
    }, 300);
  }
  function stopMove() {
    clearTimeout(moveHoldTimer); clearInterval(moveRepeatTimer);
    moveHoldTimer = null; moveRepeatTimer = null;
  }

  /* ══ 插入日期 ══ */
  function insertDate() {
    const d = new Date();
    insertText(`${d.getFullYear()}/${String(d.getMonth()+1).padStart(2,'0')}/${String(d.getDate()).padStart(2,'0')}`);
  }

  /* ══ 數字鍵盤 ══ */
  function toggleNumpad() {
    const n = document.getElementById('numpad');
    n.style.display = (n.style.display === 'none') ? 'block' : 'none';
    editor.focus();
  }

  /* ══ 符號面板 ══ */
  function toggleSymbol() {
    const p = document.getElementById('symbol-panel');
    const btn = document.getElementById('symbolToggleBtn');
    const open = p.style.display === 'block';
    p.style.display = open ? 'none' : 'block';
    btn.textContent = open ? '插入符號' : '收起符號';
    if (!open) setTimeout(() => p.scrollIntoView({ behavior: 'smooth', block: 'nearest' }), 50);
    editor.focus();
  }

  /* ══ 貼上（貼到游標位置） ══ */
  function pasteText() {
    navigator.clipboard.readText()
      .then(text => {
        if (!text) return;
        insertText(text);
      })
      .catch(() => alert('無法存取剪貼簿，請確認已授予權限，或手動長按貼上。'));
  }

  /* ══ 複製全文 ══ */
  function copyAll() {
    if (!editor.value) { alert('目前沒有內容可複製。'); return; }
    navigator.clipboard.writeText(editor.value)
      .then(() => alert('全文已複製！'))
      .catch(() => { editor.select(); editor.setSelectionRange(0, 99999); alert('請手動長按全選後複製。'); });
  }

  /* ══ 時間戳 ══ */
  function getTimestamp() {
    const d = new Date();
    return `${d.getFullYear()}/${String(d.getMonth()+1).padStart(2,'0')}/${String(d.getDate()).padStart(2,'0')} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
  }

  /* ══ 預覽文字 ══ */
  function makePreview(text) {
    const clean = text.replace(/\n/g, ' ');
    return clean.substring(0, PREVIEW_LEN) + (clean.length > PREVIEW_LEN ? '……' : '');
  }

  /* ══ 自動儲存 ══ */
  function autoSave() {
    if (editor.value.trim() === '') return;
    localStorage.setItem(AUTO_SAVE_KEY, JSON.stringify({ time: getTimestamp(), text: editor.value }));
    updateAutoSavePreview();
  }
  function updateAutoSavePreview() {
    const raw = localStorage.getItem(AUTO_SAVE_KEY);
    const el = document.getElementById('preview-auto');
    if (!raw) { el.textContent = '尚無自動存檔'; return; }
    try {
      const data = JSON.parse(raw);
      el.textContent = `${data.time}　${makePreview(data.text)}`;
    } catch(e) { el.textContent = '尚無自動存檔'; }
  }
  function loadAutoSave() {
    const raw = localStorage.getItem(AUTO_SAVE_KEY);
    if (!raw) { alert('尚無自動存檔紀錄。'); return; }
    if (editor.value.trim() !== '' && !confirm('讀取將覆蓋現有文字，確定嗎？')) return;
    editor.value = JSON.parse(raw).text;
    saveHistory(); editor.focus();
  }
  function clearAutoSave() {
    if (!localStorage.getItem(AUTO_SAVE_KEY)) return;
    if (confirm('確定永久刪除自動存檔嗎？')) {
      localStorage.removeItem(AUTO_SAVE_KEY);
      updateAutoSavePreview();
    }
  }

  /* ══ 草稿 ══ */
  function saveDraft(slot) {
    localStorage.setItem('draft_' + slot, JSON.stringify({ time: getTimestamp(), text: editor.value }));
    updatePreview(slot);
    alert('已存入草稿 ' + slot);
  }
  function loadDraft(slot) {
    const raw = localStorage.getItem('draft_' + slot);
    if (!raw) { alert('草稿 ' + slot + ' 目前為空。'); return; }
    if (editor.value.trim() !== '' && !confirm('讀取將覆蓋現有文字，確定嗎？')) return;
    editor.value = JSON.parse(raw).text;
    saveHistory(); editor.focus();
  }
  function clearDraft(slot) {
    if (!localStorage.getItem('draft_' + slot)) return;
    if (confirm('確定永久刪除草稿 ' + slot + ' 嗎？')) {
      localStorage.removeItem('draft_' + slot);
      updatePreview(slot);
    }
  }
  function updatePreview(slot) {
    const raw = localStorage.getItem('draft_' + slot);
    const el = document.getElementById('preview-' + slot);
    if (!raw) { el.textContent = '尚無存檔'; return; }
    try {
      const data = JSON.parse(raw);
      el.textContent = `${data.time}　${makePreview(data.text)}`;
    } catch(e) { el.textContent = '尚無存檔'; }
  }
</script>
</body>
</html>
