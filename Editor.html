<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>手機打字好痛苦</title>
<style>
  :root {
    --base-font-size: 16px;
    --bg: #FDF6E3;
    --text: #333333;
    --border: #D0C9B0;
    --area-bg: #F7F0DC;

    --btn-default-bg: #EDEADE;
    --btn-default-text: #444444;
    --btn-move-bg: #E8EAE0;
    --btn-move-text: #3D4A3D;
    --btn-history-bg: #E5EDE5;
    --btn-history-text: #2E4A2E;
    --btn-delete-bg: #C8784A;
    --btn-delete-text: #FFFFFF;
    --btn-symbol-bg: #EDEADE;
    --btn-symbol-text: #4A4030;
    --btn-draft-bg: #EDEADE;
    --btn-draft-del-bg: #F0E4E4;
    --btn-draft-del-text: #7A3030;

    --btn-refresh-bg: #2F4F4F;
    --btn-refresh-text: #FFFFFF;
    --btn-copy-bg: #C8925A;
    --btn-copy-text: #FFFFFF;

    --btn-kbd-on-bg: #B8D4B8;
    --btn-kbd-off-bg: #DEDAD0;
  }

  * { -webkit-appearance: none; box-sizing: border-box; }
  button { -webkit-appearance: none; color: var(--btn-default-text); }

  html { font-size: var(--base-font-size); transition: font-size 0.25s ease; }

  body {
    background-color: var(--bg);
    color: var(--text);
    font-family: "PingFang TC", "Noto Sans TC", sans-serif;
    margin: 0;
    padding: 0;
    display: flex;
    flex-direction: column;
    height: 100dvh;
    overflow: hidden;
  }

  .sticky-header {
    flex-shrink: 0;
    background-color: var(--bg);
    border-bottom: 1px solid var(--border);
    padding: 0.45rem 0.75rem;
    display: flex;
    flex-direction: column;
    gap: 0.35rem;
    z-index: 10;
  }

  #kbdToggleBtn {
    width: 100%;
    font-size: 0.95rem;
    padding: 0.55rem;
    background-color: var(--btn-kbd-off-bg);
    color: var(--btn-default-text);
    font-weight: bold;
  }
  #kbdToggleBtn.kbd-on {
    background-color: var(--btn-kbd-on-bg);
    color: #1A3A1A;
  }

  .top-action-row {
    display: flex;
    gap: 0.5rem;
  }
  .top-action-row button {
    flex: 1;
    font-weight: bold;
    font-size: 1rem;
    padding: 0.65rem;
    border: none;
    border-radius: 0.4rem;
    color: #fff;
  }
  .btn-refresh { background-color: var(--btn-refresh-bg) !important; color: var(--btn-refresh-text) !important; }
  .btn-copy-top { background-color: var(--btn-copy-bg) !important; color: var(--btn-copy-text) !important; }

  .scroll-area {
    flex: 1;
    overflow-y: auto;
    overflow-x: hidden;
    padding: 0.6rem 0.75rem;
    display: flex;
    flex-direction: column;
    gap: 0.45rem;
    -webkit-overflow-scrolling: touch;
  }

  .title-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 0.3rem;
  }
  .title-row h1 {
    font-size: 0.9rem;
    margin: 0;
    font-weight: bold;
    color: #5A4A2A;
    flex: 1;
    line-height: 1.3;
  }
  .title-row-actions {
    display: flex;
    gap: 0.3rem;
    align-items: center;
    position: relative;
    flex-shrink: 0;
  }

  button {
    font-size: 1rem;
    padding: 0.55rem 0.5rem;
    border: 1px solid var(--border);
    border-radius: 0.35rem;
    background-color: var(--btn-default-bg);
    color: var(--btn-default-text);
    cursor: pointer;
    touch-action: manipulation;
    user-select: none;
    -webkit-user-select: none;
    line-height: 1.2;
    text-align: center;
    transition: filter 0.1s;
  }
  button:active { filter: brightness(0.88); }
  button:disabled { opacity: 0.3; }

  .btn-info {
    background-color: var(--btn-symbol-bg);
    color: #666;
    font-weight: bold;
    font-size: 0.9rem;
  }

  .bubble-window {
    display: none;
    position: absolute;
    top: calc(100% + 0.4rem);
    right: 0;
    width: 260px;
    background-color: #FFFDF8;
    border: 1px solid var(--border);
    border-radius: 0.5rem;
    padding: 0.9rem 1rem;
    box-shadow: 0 4px 14px rgba(80,50,10,0.13);
    z-index: 200;
    font-size: 0.88rem;
    color: var(--text);
  }
  .bubble-window ul { margin: 0; padding-left: 1.2rem; }
  .bubble-window li { margin-bottom: 0.45rem; line-height: 1.5; }
  .bubble-window li:last-child { margin-bottom: 0; }
  .bubble-window .warn { color: #8B3030; font-weight: bold; }

  .editor-container { display: flex; flex-direction: column; }
  textarea {
    width: 100%;
    min-height: 9rem;
    font-size: 1.2rem;
    padding: 0.8rem;
    border: 1px solid var(--border);
    border-radius: 0.5rem;
    background-color: #FFFDF8;
    color: var(--text);
    resize: vertical;
    line-height: 1.6;
    -webkit-appearance: none;
  }
  textarea:focus { outline: 2px solid #C8925A; }

  .ctrl-label {
    font-size: 0.75rem;
    color: #9A8A6A;
    margin-bottom: 0.2rem;
    padding-left: 0.1rem;
  }

  .toolbar-move {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 0.4rem;
  }
  .toolbar-move button {
    background-color: var(--btn-move-bg);
    color: var(--btn-move-text);
    font-weight: bold;
    font-size: 1.05rem;
  }

  .toolbar-action {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 0.4rem;
  }
  .btn-undo, .btn-redo {
    background-color: var(--btn-history-bg);
    color: var(--btn-history-text);
  }
  .btn-del {
    background-color: var(--btn-delete-bg) !important;
    color: var(--btn-delete-text) !important;
    border-color: #A05A30 !important;
    font-weight: bold;
  }

  .toolbar-insert {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 0.4rem;
  }
  .toolbar-insert button {
    background-color: var(--btn-symbol-bg);
    color: var(--btn-symbol-text);
  }

  .symbol-panel {
    display: none;
    background-color: var(--area-bg);
    border: 1px solid var(--border);
    border-radius: 0.4rem;
    padding: 0.45rem;
  }
  .symbol-panel .sym-row { display: flex; flex-wrap: wrap; gap: 0.4rem; }
  .symbol-panel button {
    flex: 0 0 auto;
    min-width: 3rem;
    background-color: #FFFDF8;
    color: var(--btn-symbol-text);
    font-size: 1.05rem;
  }

  .numpad-wrapper {
    background-color: var(--area-bg);
    border: 1px solid var(--border);
    border-radius: 0.5rem;
    padding: 0.5rem;
  }
  .numpad-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 0.45rem; }
  .numpad-grid button { padding: 0.9rem 0; font-size: 1.45rem; font-weight: bold; background-color: #FFFDF8; }
  .numpad-grid .num-action { font-size: 0.9rem; background-color: var(--btn-default-bg); }

  .draft-section {
    border-top: 1px solid var(--border);
    padding-top: 0.5rem;
    display: flex;
    flex-direction: column;
    gap: 0;
  }
  .draft-item {
    display: flex;
    flex-direction: column;
    gap: 0.15rem;
    padding: 0.35rem 0;
    border-bottom: 1px dashed var(--border);
  }
  .draft-item:last-child { border-bottom: none; }
  .draft-row {
    display: flex;
    align-items: center;
    gap: 0.4rem;
  }
  .draft-row-title {
    font-size: 0.82rem;
    font-weight: bold;
    color: #5A4A2A;
    flex-shrink: 0;
    min-width: 3.2rem;
  }
  .draft-btn-group {
    display: flex;
    gap: 0.3rem;
    flex-shrink: 0;
    margin-left: auto;
  }
  .draft-btn-group button {
    font-size: 0.82rem;
    padding: 0.35rem 0.6rem;
    background-color: var(--btn-draft-bg);
  }
  .btn-draft-del {
    background-color: var(--btn-draft-del-bg) !important;
    color: var(--btn-draft-del-text) !important;
    border-color: #D9BABA !important;
  }
  .draft-preview {
    font-size: 0.78rem;
    color: #888;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    line-height: 1.4;
    padding-left: 0.1rem;
  }
</style>
</head>
<body>

<header class="sticky-header" role="banner">
  <button id="kbdToggleBtn" onclick="toggleKeyboard()" aria-label="切換系統鍵盤">切換系統鍵盤（目前：關閉）</button>
  <div class="top-action-row">
    <button class="btn-refresh" onclick="resetEditor()" aria-label="重新整理">重新整理</button>
    <button class="btn-copy-top" onclick="copyAll()" aria-label="複製全文">複製全文</button>
  </div>
</header>

<main class="scroll-area" role="main">

  <div class="title-row">
    <h1>輔助輸入</h1>
    <div class="title-row-actions">
      <button class="btn-info" onclick="toggleBubble()" aria-label="說明">說明</button>
      <button onclick="changeFontSize(-2)" aria-label="縮小字體">A-</button>
      <button onclick="changeFontSize(2)" aria-label="放大字體">A+</button>
      <div id="info-bubble" class="bubble-window" role="tooltip" aria-live="polite">
        <ul>
          <li>草稿儲存於本機裝置瀏覽器暫存，無雲端同步備份功能。</li>
          <li>可離線使用。</li>
          <li class="warn">不建議輸入機敏資料（如密碼、身份證號等）。</li>
        </ul>
      </div>
    </div>
  </div>

  <div class="editor-container">
    <textarea id="editor" placeholder="在此輸入內容..." inputmode="none" aria-label="主編輯區" oninput="onEditorInput()"></textarea>
  </div>

  <div>
    
    <div class="toolbar-move" role="group" aria-label="游標移動">
      <button onclick="moveCursor('up')" aria-label="向上">上</button>
      <button onclick="moveCursor('down')" aria-label="向下">下</button>
      <button onclick="moveCursor('left')" aria-label="向左">左</button>
      <button onclick="moveCursor('right')" aria-label="向右">右</button>
    </div>
  </div>

  <div class="toolbar-action" role="group" aria-label="編輯操作">
    <button class="btn-undo" id="undoBtn" onclick="undo()" disabled aria-label="復原">復原</button>
    <button class="btn-redo" id="redoBtn" onclick="redo()" disabled aria-label="取消復原">取消復原</button>
    <button class="btn-del" id="deleteBtn" aria-label="刪除字元"
      onpointerdown="startDelete()"
      onpointerup="stopDelete()"
      onpointerleave="stopDelete()"
      onpointercancel="stopDelete()">刪除</button>
  </div>

  <div class="toolbar-insert" role="group" aria-label="插入工具">
    <button onclick="insertDate()" aria-label="插入今日日期">插入日期</button>
    <button onclick="toggleNumpad()" aria-label="數字鍵盤">數字鍵盤</button>
    <button id="symbolToggleBtn" onclick="toggleSymbol()" aria-label="插入符號">插入符號</button>
  </div>

  <div id="symbol-panel" class="symbol-panel" aria-label="符號選單">
    <div class="sym-row">
      <button onclick="insertText('「')">「</button>
      <button onclick="insertText('」')">」</button>
      <button onclick="insertText('《')">《</button>
      <button onclick="insertText('》')">》</button>
      <button onclick="insertText('→')">→</button>
      <button onclick="insertText('、')">、</button>
      <button onclick="insertText('。')">。</button>
      <button onclick="toggleSymbol()" style="font-size:0.85rem">收起</button>
    </div>
  </div>

  <div id="numpad" class="numpad-wrapper" style="display:none" aria-label="數字鍵盤">
    <div class="numpad-grid">
      <button onclick="insertText('1')">1</button>
      <button onclick="insertText('2')">2</button>
      <button onclick="insertText('3')">3</button>
      <button onclick="insertText('4')">4</button>
      <button onclick="insertText('5')">5</button>
      <button onclick="insertText('6')">6</button>
      <button onclick="insertText('7')">7</button>
      <button onclick="insertText('8')">8</button>
      <button onclick="insertText('9')">9</button>
      <button class="num-action" onclick="toggleNumpad()">收起</button>
      <button onclick="insertText('0')">0</button>
      <button class="num-action" onclick="deleteChar()">刪除</button>
    </div>
  </div>

  <div class="draft-section" role="group" aria-label="草稿管理">
    <div class="ctrl-label">草稿管理</div>

    <div class="draft-item">
      <div class="draft-row">
        <span class="draft-row-title">草稿 1</span>
        <div class="draft-btn-group">
          <button onclick="saveDraft(1)" aria-label="存入草稿 1">存入</button>
          <button onclick="loadDraft(1)" aria-label="讀取草稿 1">讀取</button>
          <button class="btn-draft-del" onclick="clearDraft(1)" aria-label="刪除草稿 1">刪除</button>
        </div>
      </div>
      <div id="preview-1" class="draft-preview" aria-live="polite">尚無存檔</div>
    </div>

    <div class="draft-item">
      <div class="draft-row">
        <span class="draft-row-title">草稿 2</span>
        <div class="draft-btn-group">
          <button onclick="saveDraft(2)" aria-label="存入草稿 2">存入</button>
          <button onclick="loadDraft(2)" aria-label="讀取草稿 2">讀取</button>
          <button class="btn-draft-del" onclick="clearDraft(2)" aria-label="刪除草稿 2">刪除</button>
        </div>
      </div>
      <div id="preview-2" class="draft-preview" aria-live="polite">尚無存檔</div>
    </div>

    <div class="draft-item">
      <div class="draft-row">
        <span class="draft-row-title">草稿 3</span>
        <div class="draft-btn-group">
          <button onclick="saveDraft(3)" aria-label="存入草稿 3">存入</button>
          <button onclick="loadDraft(3)" aria-label="讀取草稿 3">讀取</button>
          <button class="btn-draft-del" onclick="clearDraft(3)" aria-label="刪除草稿 3">刪除</button>
        </div>
      </div>
      <div id="preview-3" class="draft-preview" aria-live="polite">尚無存檔</div>
    </div>
  </div>

</main>

<script>
  const editor = document.getElementById('editor');
  let currentFontSize = 16;
  let historyStack = [''];
  let redoStack = [];
  let kbdEnabled = false;
  const MAX_HISTORY = 50;
  const PREVIEW_LEN = 16;

  window.onload = () => {
    updatePreview(1); updatePreview(2); updatePreview(3);
    updateHistoryButtons();
  };

  function toggleBubble() {
    const b = document.getElementById('info-bubble');
    b.style.display = (b.style.display === 'block') ? 'none' : 'block';
  }
  document.addEventListener('click', e => {
    if (!e.target.closest('.title-row-actions'))
      document.getElementById('info-bubble').style.display = 'none';
  });

  function changeFontSize(d) {
    currentFontSize = Math.min(Math.max(currentFontSize + d, 12), 32);
    document.documentElement.style.setProperty('--base-font-size', currentFontSize + 'px');
  }

  function toggleKeyboard() {
    kbdEnabled = !kbdEnabled;
    const btn = document.getElementById('kbdToggleBtn');
    if (kbdEnabled) {
      editor.removeAttribute('inputmode');
      btn.textContent = '切換系統鍵盤（目前：開啟）';
      btn.classList.add('kbd-on');
    } else {
      editor.setAttribute('inputmode', 'none');
      btn.textContent = '切換系統鍵盤（目前：關閉）';
      btn.classList.remove('kbd-on');
    }
    editor.focus();
  }

  function resetEditor() {
    if (editor.value.trim() === '' && historyStack.length <= 1) return;
    if (!confirm('確定重新整理？將清除輸入區內容與復原紀錄，草稿不受影響。')) return;
    editor.value = '';
    historyStack = [''];
    redoStack = [];
    updateHistoryButtons();
    kbdEnabled = false;
    const btn = document.getElementById('kbdToggleBtn');
    editor.setAttribute('inputmode', 'none');
    btn.textContent = '切換系統鍵盤（目前：關閉）';
    btn.classList.remove('kbd-on');
    editor.focus();
  }

  function onEditorInput() {
    const cur = editor.value;
    if (cur === historyStack[historyStack.length - 1]) return;
    historyStack.push(cur);
    if (historyStack.length > MAX_HISTORY) historyStack.shift();
    redoStack = [];
    updateHistoryButtons();
  }
  function saveHistory() { onEditorInput(); }

  function undo() {
    if (historyStack.length > 1) {
      redoStack.push(historyStack.pop());
      editor.value = historyStack[historyStack.length - 1];
      updateHistoryButtons();
    }
  }
  function redo() {
    if (redoStack.length > 0) {
      const val = redoStack.pop();
      historyStack.push(val);
      editor.value = val;
      updateHistoryButtons();
    }
  }
  function updateHistoryButtons() {
    document.getElementById('undoBtn').disabled = (historyStack.length <= 1);
    document.getElementById('redoBtn').disabled = (redoStack.length === 0);
  }

  function deleteChar() {
    editor.focus();
    const s = editor.selectionStart, e2 = editor.selectionEnd;
    if (s === e2 && s > 0) {
      editor.value = editor.value.substring(0, s - 1) + editor.value.substring(e2);
      editor.setSelectionRange(s - 1, s - 1);
    } else if (s !== e2) {
      editor.value = editor.value.substring(0, s) + editor.value.substring(e2);
      editor.setSelectionRange(s, s);
    }
    saveHistory();
  }

  let deleteHoldTimer = null, deleteRepeatTimer = null;
  function startDelete() {
    deleteChar();
    deleteHoldTimer = setTimeout(() => {
      deleteRepeatTimer = setInterval(deleteChar, 80);
    }, 300);
  }
  function stopDelete() {
    clearTimeout(deleteHoldTimer);
    clearInterval(deleteRepeatTimer);
    deleteHoldTimer = null; deleteRepeatTimer = null;
  }

  function insertText(text) {
    const s = editor.selectionStart, e2 = editor.selectionEnd;
    editor.value = editor.value.substring(0, s) + text + editor.value.substring(e2);
    editor.focus();
    editor.setSelectionRange(s + text.length, s + text.length);
    saveHistory();
  }

  function moveCursor(direction) {
    editor.focus();
    const start = editor.selectionStart, text = editor.value;
    if (direction === 'left' && start > 0) {
      editor.setSelectionRange(start - 1, start - 1);
    } else if (direction === 'right' && start < text.length) {
      editor.setSelectionRange(start + 1, start + 1);
    } else if (direction === 'up' || direction === 'down') {
      const lines = text.split('\n');
      let acc = 0, lineIdx = 0, colIdx = 0;
      for (let i = 0; i < lines.length; i++) {
        if (start <= acc + lines[i].length) { lineIdx = i; colIdx = start - acc; break; }
        acc += lines[i].length + 1;
      }
      if (direction === 'up' && lineIdx > 0) {
        let newAcc = 0;
        for (let j = 0; j < lineIdx - 1; j++) newAcc += lines[j].length + 1;
        const newPos = newAcc + Math.min(colIdx, lines[lineIdx - 1].length);
        editor.setSelectionRange(newPos, newPos);
      } else if (direction === 'down' && lineIdx < lines.length - 1) {
        let newAcc = 0;
        for (let j = 0; j <= lineIdx; j++) newAcc += lines[j].length + 1;
        const newPos = newAcc + Math.min(colIdx, lines[lineIdx + 1].length);
        editor.setSelectionRange(newPos, newPos);
      }
    }
  }

  function insertDate() {
    const d = new Date();
    insertText(`${d.getFullYear()}/${String(d.getMonth()+1).padStart(2,'0')}/${String(d.getDate()).padStart(2,'0')}`);
  }

  function toggleNumpad() {
    const n = document.getElementById('numpad');
    n.style.display = (n.style.display === 'none') ? 'block' : 'none';
    editor.focus();
  }

  function toggleSymbol() {
    const p = document.getElementById('symbol-panel');
    const btn = document.getElementById('symbolToggleBtn');
    const open = p.style.display === 'block';
    p.style.display = open ? 'none' : 'block';
    btn.textContent = open ? '插入符號' : '收起符號';
    if (!open) setTimeout(() => p.scrollIntoView({ behavior: 'smooth', block: 'nearest' }), 50);
    editor.focus();
  }

  function copyAll() {
    if (!editor.value) { alert('目前沒有內容可複製。'); return; }
    navigator.clipboard.writeText(editor.value)
      .then(() => alert('全文已複製！'))
      .catch(() => { editor.select(); editor.setSelectionRange(0, 99999); alert('請手動長按全選後複製。'); });
  }

  function getTimestamp() {
    const d = new Date();
    return `${d.getFullYear()}/${String(d.getMonth()+1).padStart(2,'0')}/${String(d.getDate()).padStart(2,'0')} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
  }

  function saveDraft(slot) {
    localStorage.setItem('draft_' + slot, JSON.stringify({ time: getTimestamp(), text: editor.value }));
    updatePreview(slot);
    alert('已存入草稿 ' + slot);
  }
  function loadDraft(slot) {
    const raw = localStorage.getItem('draft_' + slot);
    if (!raw) { alert('草稿 ' + slot + ' 目前為空。'); return; }
    if (editor.value.trim() !== '' && !confirm('讀取將覆蓋現有文字，確定嗎？')) return;
    editor.value = JSON.parse(raw).text;
    saveHistory(); editor.focus();
  }
  function clearDraft(slot) {
    if (!localStorage.getItem('draft_' + slot)) return;
    if (confirm('確定永久刪除草稿 ' + slot + ' 嗎？')) {
      localStorage.removeItem('draft_' + slot);
      updatePreview(slot);
    }
  }
  function updatePreview(slot) {
    const raw = localStorage.getItem('draft_' + slot);
    const el = document.getElementById('preview-' + slot);
    if (!raw) { el.textContent = '尚無存檔'; return; }
    try {
      const data = JSON.parse(raw);
      const clean = data.text.replace(/\n/g, ' ');
      const preview = clean.substring(0, PREVIEW_LEN) + (clean.length > PREVIEW_LEN ? '……' : '');
      el.textContent = `${data.time}　${preview}`;
    } catch(e) { el.textContent = '尚無存檔'; }
  }
</script>
</body>
</html>
