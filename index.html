<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>懶散的工具箱</title>
    <style>
        :root {
            --bg-color: #fffaf0; /* 暖調米色 */
            --text-color: #4a4a4a;
            --accent-color: #e9edc9;
            --link-color: #606c38;
            --card-bg: #ffffff;
            --shadow: rgba(0, 0, 0, 0.08);
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }

        .container {
            width: 90%;
            max-width: 500px;
            padding: 2rem;
            text-align: center;
        }

        header {
            margin-bottom: 3rem;
        }

        h1 {
            font-size: 1.8rem;
            font-weight: 400;
            margin-bottom: 0.5rem;
            letter-spacing: 1px;
        }

        .tagline {
            font-size: 0.95rem;
            opacity: 0.7;
        }

        .tool-grid {
            display: flex;
            flex-direction: column;
            gap: 1.2rem;
        }

        .tool-card {
            background-color: var(--card-bg);
            padding: 1.5rem;
            border-radius: 16px;
            text-decoration: none;
            color: inherit;
            box-shadow: 0 4px 12px var(--shadow);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            border: 1px solid rgba(0,0,0,0.02);
            display: block;
            text-align: left; /* 靠左對齊 */
        }

        .tool-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 16px var(--shadow);
        }

        .tool-name {
            display: block;
            font-size: 1.1rem;
            font-weight: 500;
            color: var(--link-color);
            margin-bottom: 0.3rem;
        }

        .tool-desc {
            font-size: 0.85rem;
            opacity: 0.6;
            display: block;
        }

        /* 您的專屬淺灰虛線 */
        .tool-divider {
            border: none;
            border-top: 2px dashed #dcdcdc;
            margin: 1rem 0;
        }

        /* 附註文字樣式 */
        .tool-note {
            font-size: 0.8rem;
            opacity: 0.65;
            color: #666;
            line-height: 1.5;
        }

        .tool-note p {
            margin: 0 0 0.4rem 0;
            font-weight: 500;
        }

        .tool-note ul {
            margin: 0;
            padding-left: 1.2rem;
        }

        .tool-note li {
            margin-bottom: 0.2rem;
        }

        .placeholder-card {
            border: 2px dashed #dcdcdc;
            padding: 1.2rem;
            border-radius: 16px;
            font-size: 0.9rem;
            color: #999;
            margin-top: 1rem;
        }

        footer {
            margin-top: 4rem;
            font-size: 0.8rem;
            opacity: 0.4;
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>懶散的工具箱</h1>
            <p class="tagline">這裡什麼都沒有，只有幾個想用的東西。</p>
        </header>

        <main class="tool-grid">
            <a href="Editor.html" class="tool-card">
                <span class="tool-name">手機打字不哭</span>
                <span class="tool-desc">方便手機輸入用的游標控制與本地草稿暫存。</span>
                <hr class="tool-divider">
                <div class="tool-note">
                    <p>還是很哭：</p>
                    <ul>
                        <li>部分機型的鍵盤會遮蔽快捷按鈕。</li>
                        <li>有待修 Bug。</li>
                    </ul>
                </div>
            </a>

            <a href="Readmoo_Coupon_Share_Tool.html" class="tool-card">
                <span class="tool-name">Readmoo 序號分享工具</span>
                <span class="tool-desc">固定判斷式，可能發生判讀錯誤。</span>
            </a>

            <div class="placeholder-card">
                個人簡單用，沒有很仔細測試。
            </div>
        </main>

        <footer>
            [2026-06-09 版]
        </footer>
    </div>

</body>
</html>
